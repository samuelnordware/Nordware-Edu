button,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--green);outline-offset:2px}

.msg{font-size:.9rem;color:var(--muted);margin-top:12px}.msg.err{color:var(--danger)}
.player{position:fixed;inset:0;border:0;width:100%;height:100%}

<template id="tpl"><style>
:root{--navy:#1E2543;--deep:#0F1923;--green:#06AF74;--green-h:#049671;--on-green:#FFFFFF;--green-ink:#037D6B;--aqua:#37F7D5;--grad:linear-gradient(90deg,#06AF74,#37F7D5);--bg:#FFFFFF;--surface:#F8F9FA;--surface2:#F1F3F5;--ink:#1A1A2E;--muted:#4A5568;--faint:#718096;--line:#DAE4E2;--line2:#B2C5C1;--soft:rgba(6,175,116,.10);--danger:#E5484D;--warn-bg:#FEF3C7;--warn:#92400E;--top:#FFFFFF;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--green:#00D58B;--green-h:#39CF8B;--on-green:#0F1923;--green-ink:#00D58B;--bg:#0F1923;--surface:#162032;--surface2:#1C2940;--ink:#F0F4F8;--muted:#A0AEC0;--faint:#8593A8;--line:#1E2D42;--line2:#2A3F5F;--soft:rgba(0,213,139,.12);--danger:#FB7185;--warn-bg:rgba(251,191,36,.15);--warn:#FBBF24;--top:#0F1923;color-scheme:dark}}
:root[data-theme="dark"]{--green:#00D58B;--green-h:#39CF8B;--on-green:#0F1923;--green-ink:#00D58B;--bg:#0F1923;--surface:#162032;--surface2:#1C2940;--ink:#F0F4F8;--muted:#A0AEC0;--faint:#8593A8;--line:#1E2D42;--line2:#2A3F5F;--soft:rgba(0,213,139,.12);--danger:#FB7185;--warn-bg:rgba(251,191,36,.15);--warn:#FBBF24;--top:#0F1923;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;font-variant-numeric:lining-nums}
button,input{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.top{height:60px;background:var(--top);border-bottom:1px solid var(--line);color:var(--ink);display:flex;align-items:center;gap:14px;padding:0 18px}
.top img{height:23px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top img{filter:brightness(0) invert(1)}}
:root[data-theme="dark"] .top img{filter:brightness(0) invert(1)}
.eduw{font-weight:400;font-size:1.32rem;line-height:1;padding-left:12px;border-left:1.5px solid var(--line2);color:var(--ink);letter-spacing:.01em}
.top .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top .sp{flex:1}
.prog{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);font-weight:700;font-variant-numeric:lining-nums tabular-nums}
.lay{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 60px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.lay.cinema{grid-template-columns:0 minmax(0,1fr)}.lay.cinema .player{width:min(100%,calc((100vh - 170px) * 16 / 9))}.lay.cinema .side{display:none}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:.95rem}
.search:focus{border-color:var(--green)}
.hint{font-size:.78rem;color:var(--muted);margin-top:6px}
.list{overflow-y:auto;flex:1;padding:6px 0 30px}
.aula{margin:14px 16px 6px;font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.clip{display:grid;grid-template-columns:112px 1fr;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid transparent;padding:8px 14px 8px 12px;cursor:pointer;color:var(--ink)}
.clip:hover{background:var(--surface2)}.clip.on{border-left-color:var(--green);background:var(--soft)}
.th{width:112px;height:63px;border-radius:7px;background:var(--deep);position:relative;overflow:hidden;display:block}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;right:4px;bottom:4px;background:rgba(15,25,35,.85);color:#fff;font-size:.68rem;padding:0 5px;border-radius:4px}
.th i{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:var(--green);display:none}
.clip.done .th i{display:block}
.n{font-size:.72rem;font-weight:800;color:var(--green-ink)}.ti{font-weight:700;font-size:.9rem;line-height:1.25}.pr{font-size:.74rem;color:var(--muted)}
mark{background:rgba(0,213,139,.3);color:inherit;border-radius:3px;padding:0 2px}
.snip{font-size:.8rem;color:var(--muted);margin-top:2px}
.main{overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.player{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;margin:0 auto;width:min(100%,calc((100vh - 250px) * 16 / 9));min-width:min(100%,520px);flex-shrink:0}
.player canvas{width:100%;height:100%;display:block;object-fit:contain}
.player:fullscreen{border-radius:0;width:100%;height:100%;aspect-ratio:auto;background:#000}
.player:fullscreen canvas{object-fit:contain}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#F0F4F8;text-align:center;padding:24px;background:var(--deep)}
.ov h2{margin:0;font-size:1.25rem}.ov p{margin:0;color:#A0AEC0;max-width:480px}
.prac{position:absolute;left:0;right:0;bottom:5%;display:flex;gap:10px;justify-content:center}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--green);color:var(--on-green);transition:background-color .15s ease-out,border-color .15s ease-out}
.btn:not(.ghost):not(.dark):not(.danger):not(:disabled):hover{background:var(--green-h)}
.btn.dark{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 10px;font-size:.82rem;border-radius:8px}
.ctrl{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;flex-wrap:wrap}
.time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:118px}
.tl{position:relative;flex:1;min-width:200px;height:30px;cursor:pointer}
.tl .tr{position:absolute;left:0;right:0;top:12px;height:6px;background:var(--line);border-radius:3px}
.tl .fi{position:absolute;left:0;top:12px;height:6px;background:var(--grad);border-radius:3px}
.tl .mk{position:absolute;top:7px;width:2px;height:16px;background:var(--muted);opacity:.5}
.tl .mk.au{width:3px;height:24px;top:3px;background:var(--green);opacity:1}
.ctrl select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--surface)}
.ctrl label{display:flex;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.now .k{font-size:.75rem;font-weight:800;color:var(--green-ink);letter-spacing:.04em}
.now h2{margin:4px 0 6px;font-size:1.45rem;font-weight:800}.now p{margin:0 0 10px;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0}.todo li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--line)}
.todo input{width:18px;height:18px;margin-top:2px;accent-color:var(--green)}

const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show=id=>{["vLogin","vList","vMsg"].forEach(x=>$("#"+x).hidden=x!==id)};
const msg=(t,b)=>{$("#mT").textContent=t;$("#mB").textContent=b;show("vMsg")};
if(!window.supabase||CONFIG.SUPABASE_URL.includes("SEU-PROJETO")){msg("Configuração pendente","Preencha SUPABASE_URL e SUPABASE_PUBLIC_KEY no início do arquivo treinamento.html.");return}
let sb=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLIC_KEY);
let {data:{session}}=await sb.auth.getSession();
// Se a plataforma guarda a sessão em cookies (@supabase/ssr), reaproveita o mesmo login
if(!session&&document.cookie.includes("sb-")){try{const m=await import("https://esm.sh/@supabase/ssr@0.5.2");const c=m.createBrowserClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_PUBLIC_KEY);const r=await c.auth.getSession();if(r.data.session){sb=c;session=r.data.session}}catch(e){}}
if(!session){show("vLogin");
  $("#send").onclick=async()=>{const email=$("#em").value.trim();if(!email){$("#lmsg").textContent="Informe o e-mail.";return}$("#send").disabled=true;
   const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href,shouldCreateUser:false}});$("#send").disabled=false;
   $("#lmsg").className=error?"msg err":"msg";$("#lmsg").textContent=error?"Não foi possível enviar o link. Verifique se o e-mail está cadastrado.":"Link enviado. Abra seu e-mail neste mesmo navegador."};
  return}
$("#who").textContent=session.user.email||"";$("#out").hidden=false;$("#out").onclick=async()=>{await sb.auth.signOut();location.href=location.pathname};
const slug=new URLSearchParams(location.search).get("t");
if(!slug){show("vList");
  const {data,error}=await sb.from(CONFIG.TABELA).select("slug,titulo,roteiro->steps").eq("status","publicado").order("titulo");
  if(error){$("#gmsg").textContent="Não foi possível carregar os treinamentos.";return}
  if(!data.length){$("#gmsg").textContent="Nenhum treinamento liberado para a sua empresa ainda.";return}
  $("#grid").innerHTML=data.map(t=>{const st=Array.isArray(t.steps)?t.steps:[],th=(st.find(s=>s.thumb)||{}).thumb;return`<a class="card" href="?t=${encodeURIComponent(t.slug)}">${th&&th.startsWith("data:image/")?`<img class="th" src="${th}" alt="">`:`<span class="th"></span>`}<div class="b"><h2>${esc(t.titulo)}</h2><p>${st.length} passos</p></div></a>`}).join("");
  return}
const {data:t,error}=await sb.from(CONFIG.TABELA).select("titulo,video_path,roteiro").eq("slug",slug).maybeSingle();
if(error||!t){msg("Treinamento indisponível","Este treinamento não existe ou não está liberado para a sua empresa.");return}
const {data:link,error:e2}=await sb.storage.from(CONFIG.BUCKET).createSignedUrl(t.video_path,CONFIG.VALIDADE_LINK_VIDEO_S);
if(e2||!link){msg("Vídeo indisponível","Não foi possível carregar o vídeo deste treinamento. Avise a Nordware.");return}
document.title=t.titulo+" – Nordware Edu";$("#hd").hidden=true;["vLogin","vList","vMsg"].forEach(x=>$("#"+x).hidden=true);
const dados={...t.roteiro,title:t.titulo,preview:false,video:{mode:"url",url:link.signedUrl}};
const html='<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400..900&display=swap" rel="stylesheet"></head><body>'+$("#tpl").innerHTML.replace("/*DATA*/null",()=>JSON.stringify(dados).replace(/</g,"\\u003c"))+'</body></html>';
const f=$("#player");f.srcdoc=html;f.hidden=false;
})();
</script>
</body>
</html>
